<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Design your taco</title>
</head>
<body>
    <h1>Designate your wrap:</h1>
    <img th:src="@{/images/TacoCloud.png}">

    <form method="POST" th:action="@{/design}" th:object="${taco}">
        <div class="grid">

            <div class ="ingredient-group" id="wraps">
                <h3>Design your wrap</h3>
                <div th:each="ingredient : ${wrap}">

                    <input th:field="*{ingredients}" type="checkbox"
                    th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGRIDIENT</span></br>
                </div>
            </div>

            <div class ="ingredient-group" id ="proteins">
                <h3>Design your protein</h3>
                <div th:each="ingredient : ${protein}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span></br>
                </div>
            </div>

            <div class ="ingredient-group" id ="cheesess">
                <h3>Design your cheese</h3>
                <div th:each="ingredient : ${cheese}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span></br>
                </div>
            </div>
            <div class ="ingredient-group" id ="veggies">
                <h3>Design your veggies</h3>
                <div th:each="ingredient : ${veggies}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span></br>
                </div>
            </div>
            <div class ="ingredient-group" id ="sauce">
                <h3>Design your sauces</h3>
                <div th:each="ingredient : ${sauce}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span></br>
                </div>
            </div>
        </div>
        <div>
            <h3>Name your Creation!</h3>
            <input type="text" th:field="*{name}"/>
            </br>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
